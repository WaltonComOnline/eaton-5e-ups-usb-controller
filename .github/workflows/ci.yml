name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore EatonUsbController.slnx
      - name: Build
        run: dotnet build EatonUsbController.slnx -c Release --no-restore --nologo
      - name: Test
        run: dotnet run --project tests/EatonUsbController.Tests/EatonUsbController.Tests.csproj -c Release --no-build