name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-msi:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.2
          wix extension add --global WixToolset.UI.wixext/6.0.2
          wix extension add --global WixToolset.Util.wixext/6.0.2
      - name: Build MSI
        shell: pwsh
        run: ./installer/build-installer.ps1
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eaton5EController-${{ github.ref_name }}
          path: installer/Eaton5EController.msi
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Eaton5EController.msi
          generate_release_notes: true